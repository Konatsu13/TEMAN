      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('teman_theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          try {
            var savedPreset = localStorage.getItem('teman_theme_preset');
            var validPresets = [
              'teman',
              'tokyo-night',
              'codex',
              'linear',
              'github',
              'nord',
              'dracula'
            ];
            if (validPresets.indexOf(savedPreset) !== -1) {
              document.documentElement.setAttribute('data-theme-preset', savedPreset);
            } else {
              document.documentElement.setAttribute('data-theme-preset', 'teman');
            }
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
